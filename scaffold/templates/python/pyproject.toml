[project]
name = "__SERVICE_NAME__"
version = "0.1.0"
description = "TODO: describe this service."
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",  # the starter tests run with the same coverage gate as the monorepo
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
select = ["E", "F", "I", "B", "C4", "UP", "S", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# W15-T5: without this hatchling cannot find the package under src/ and `uv run` fails on the
# freshly scaffolded service ("Unable to determine which files to ship").
[tool.hatch.build.targets.wheel]
packages = ["src/__MODULE_NAME__"]
