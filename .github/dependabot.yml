version: 2
# Multi-language SCA coverage (RFC-0015): Python, GitHub Actions, npm (frontend),
# Go (event-worker), Maven (domain-service), and Docker base images. Minor/patch
# updates are grouped to limit PR noise; majors stay individual for review.
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /scaffold/templates/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directories:
      - /frontend/web
      - /scaffold/templates/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directories:
      - /services/event-worker
      - /scaffold/templates/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: maven
    directories: # W14-T4 (issue #379): golden-signals was outside Dependabot
      - /services/domain-service
      - /services/golden-signals
      - /scaffold/templates/java
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /
      - /services/event-worker
      - /frontend/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

  # W14-T4 (issue #379): docker-compose.yml pinned 2024-era observability images that no bot
  # bumped (OTel collector, Prometheus, Grafana, Jaeger, Alertmanager).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compose-minor-patch:
        update-types: ["minor", "patch"]
